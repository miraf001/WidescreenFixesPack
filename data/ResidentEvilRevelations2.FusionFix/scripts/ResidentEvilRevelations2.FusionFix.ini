[MAIN]
SkipIntro = 1
BorderlessWindowed = 1
DisableDamageOverlay = 1
DisableFilmGrain = 1            
DisableFade = 0                 // Not recommended
FOVFactor = 1.0
DisableCreateQuery = 0          // Use for potential performance improvement
ForceLogo = 0                   // 0: Default, 1: Biohazard (r), 2 or 4: Resident Evil (r), 3: Resident Evil (tm)

[GRAPHICS]
DisableCoopEffectFilter = 1     // Keep the SP global exclusion mask in co-op; local effect rules remain intact
RestoreCoopBulletMarks = 1      // Allow bullet-mark creation in co-op (a separate native restriction)
                               // Both options: 0 = native behavior, 1 = restoration; RESTART required, not F5
                               // Experimental: verify rendering/stability with both player cameras

[COOP]
ViewportHud = 1                // SP layout for ammo/herbs/flashlight/Base crosshair, fitted to each viewport
                              // Shape follows viewport height uniformly; placement follows width/height separately
NativeKeyboardMousePlayer1 = 1 // Native keyboard/mouse for assigned player 1 only; player 2 keeps their gamepad
                              // Bridge F9 capture is read automatically, no external capture relay needed
AdaptiveInventory = 1         // Fit and center Campaign Inventory/Quick Menu; keep previews and hotkeys aligned
PartnerCommandViewport = 1    // Clamp Near/Far partner markers to each current split-screen viewport
KeyboardPartnerCommand = 1    // In co-op, P1 Tab shows the partner marker for three seconds; SP Tab stays native
DualMonitorMode = 0            // 0 = single monitor: one shared subtitle and one native pause UI; 1 = duplicate subtitle + pause UI on each equal monitor
                              // Dual mode replays only the full-canvas pause menu, objective and bottom guide/controls. RESTART required; F5 can only disable replay.
                              // All COOP settings derive scale/position from live viewports; keep 0 unless the game spans two equal-width displays.

[HUD]
UseSinglePlayerLayout = 0       // Rejected canvas experiment; ignored by the restored build
OffsetX = 0.0                   // Horizontal offset relative to each split-screen viewport
OffsetY = 0.0                   // Vertical offset relative to each split-screen viewport
ScaleX = 1.0                    // Fine tuning of the legacy split-screen HUD correction
ScaleY = 1.0                    // Fine tuning of the legacy split-screen HUD correction
                                // Legacy tuning applies to other GUI, NOT the five ViewportHud classes above
                                // Press F5 in-game to reload HUD and subtitle values

[SUBTITLES]
OffsetX = 0.0                   // Fine horizontal correction after automatic SP calibration
LeftOffsetX = -0.25             // Per-player mode: horizontal center of the left monitor
RightOffsetX = 0.25             // Per-player mode: horizontal center of the right monitor
OffsetY = 0.0                   // Fine vertical correction after automatic SP calibration
ScaleX = 1.0                    // Extra width multiplier after automatic SP calibration
ScaleY = 1.0                    // Extra height multiplier after automatic SP calibration
